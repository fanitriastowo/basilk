[package]
name = "basilk"
version = "0.2.5"
edition = "2021"
description = "A Terminal User Interface (TUI) to manage your tasks with minimal kanban logic"
license = "MIT OR Apache-2.0"
authors = ["Gabriele Alfarano <gabalpha@outlook.it>"]
readme = "README.md"
homepage = "https://github.com/GabAlpha/basilk"
repository = "https://github.com/GabAlpha/basilk"
keywords = ["tui", "kanban", "tasks", "ratatui", "terminal"]
categories = ["command-line-utilities"]
default-run = "basilk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.43"
dirs = "7.0.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
tui-input = "0.15.4"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"
